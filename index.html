<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Kalkulator Anuitas</title>

    <style>
        @font-face {
            font-family: "Poppins";
            src: url("fonts/poppins-devanagari-100-normal.ttf");
        }
    footer {
        margin-top: 40px;
        padding: 16px 0;
        border-top: 3px solid #9EDAFA;
        text-align: center;
        color: #EEFCFE;
        background-color: #89AAEC;
        font-family: "Poppins", sans-serif;
        font-size: 12px;
        font-weight: bold;
    }

    footer p {
        margin: 4px 0;
    }

    .kartu {
        max-width: 360px;
        margin: 20px auto;
        padding: 28px;
        background-color: #eef3ff;
        border: 2px solid #8aaaf0;
        border-radius: 6px 6px 16px 16px;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
    }

    .kartu label {
        display: block;
        margin: 14px 0 6px;
        font-weight: bold;
        text-align: left;
    }

    .kartu input {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        font-size: 16px;
        border: 2px solid #8aaaf0;
        border-radius: 8px;
    }

    .kartu button {
        width: 100%;
        margin-top: 22px;
        padding: 12px;
        font-size: 17px;
        font-weight: bold;
        color: white;
        background-color: #2f6fed;
        border: none;
        border-radius: 8px;
        cursor: pointer;
    }

    .kartu button:hover {
        background-color: #1a4fc0;
    }

     h1 {
        text-align: center;
        color:#9EDAFA;
        font-family: "Poppins", sans-serif;
        font-size: 36px;
        margin-bottom: 24px;
        font-weight: 800;
        text-transform: uppercase;
     }

     .gambar-baris {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
        margin: 16px 0 24px;
     }

     .gambar-baris img {
        width: 150px;
        height: auto;
     }

     body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        text-align:center;
     }

     .isi {
        flex: 1;
     }

     #tabelHasil {
        display: none;
     }

     table {
        margin: 0 auto;
        border-collapse: collapse;
        border-radius:16px;
        width: 60%;
     }

     th, td {
        padding: 8px 14px;
        border-width: 2px;
        border-style: solid;
     }

     th {
        background-color: #89AAEC;
        border-color: #485AB8;
     }

     td {
        background-color: #85C1F9;
        color: #e6f6ff;
        border-color: #608BE0;
     }

     @media (max-width: 600px) {
    h1 {
        font-size: 28px;
    }

    .gambar-baris img {
        width: 90px;
    }

    .kartu {
        width: 85%;
        max-width: none;
    }

    .kartu input,
    .kartu button {
        font-size: 18px;
    }

    table {
        width: 95%;
        font-size: 14px;
    }

    footer {
        font-size: 14px;
    }
}
    </style>
</head>
<body>
    <div class="isi">
    <h1>Kalkulator Anuitas</h1>

    <div class="gambar-baris">
        <img src="mora.png.webp" alt="Logo Mora">
        <img src="rupiah.png" alt="Logo Rupiah">
        <img src="credit.png" alt="Logo Credit">
    </div>

    <div class="kartu">
        <label>Jumlah Pinjaman (Rp)</label>
        <input id="pinjaman" type="number" placeholder="contoh: 10000000">

        <label>Bunga per Bulan (%)</label>
        <input id="bunga" type="number" step="0.01" placeholder="contoh: 1.5">

        <label>Jangka Waktu (Bulan)</label>
        <input id="bulan" type="number" placeholder="contoh: 12">

        <button id="tombol">Hitung</button>
    </div>

    <div style="overflow-x: auto;">
    <table id="tabelHasil">
        <thead>
            <tr><th>Bulan</th><th>Pokok</th><th>Bunga</th><th>Anuitas</th><th>Sisa</th></tr>
        </thead>
        <tbody id="isiTabel"></tbody>
    </table>
    </div>

    </div>

    <footer>
    <p>Oleh:</p>
    <p> </p>
    <p>Alviena Maherdianti (6)</p>
    <p>Azarine Hafidzah Putri Nur Salam (7)</p>
    <p>Mohammad Lazuardi Ramdani Arrifa (21)</p>
    <p>Muhammad Alwan Aldiansyah (22)</p>
    <p>Naeyssa Nazwa Nadzira (27)</p>
    <p> </p>
    <p> XI-3 </p>
    </footer>

    <script>
        function rupiah(angka) {
                return "Rp" + Math.round(angka).toLocaleString("id-ID", {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                });
            }

        document.getElementById("tombol").addEventListener("click", function () {
            const P = parseFloat(document.getElementById("pinjaman").value);
            const bunga = parseFloat(document.getElementById("bunga").value);
            const n = parseInt(document.getElementById("bulan").value);

            if (!(P > 0) || !(bunga >= 0) || !(n > 0)) {
                alert("Isi semua kolom dengan angka yang benar ya :)");
                return;
            }

            const r = bunga / 100;

            let A;
            if (r === 0) {
                A = P / n;
            } else {
                A = P * r / (1 - Math.pow(1 + r, -n));
            }

            let sisa = P;
            let baris = "";

            for (let bulan = 1; bulan <= n; bulan++) {
                const bungaBulanIni = sisa * r;
                const pokok = A - bungaBulanIni;
                sisa = sisa - pokok;

                baris += "<tr><td>" + bulan + "</td><td>" + rupiah(pokok) +
                         "</td><td>" + rupiah(bungaBulanIni) +
                         "</td><td>" + rupiah(A) +
                         "</td><td>" + rupiah(sisa) + "</td></tr>";
            }

            document.getElementById("isiTabel").innerHTML = baris;
            document.getElementById("tabelHasil").style.display = "table";
        });
    </script>
</body>
</html>
